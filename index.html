@font-face{font-family:"Paperlogy";font-weight:100;font-style:normal;font-display:swap;src:url("https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy-1Thin.woff2") format("woff2"),url("https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy-1Thin.woff") format("woff")}

@font-face{font-family:"Paperlogy";font-weight:600;font-style:normal;font-display:swap;src:url("https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy-6SemiBold.woff2") format("woff2"),url("https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy-6SemiBold.woff") format("woff")}
@font-face{font-family:"Paperlogy";font-weight:700;font-style:normal;font-display:swap;src:url("https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy-7Bold.woff2") format("woff2"),url("https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy-7Bold.woff") format("woff")}
@font-face{font-family:"Paperlogy";font-weight:800;font-style:normal;font-display:swap;src:url("https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy-8ExtraBold.woff2") format("woff2"),url("https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy-8ExtraBold.woff") format("woff")}
@font-face{font-family:"Paperlogy";font-weight:900;font-style:normal;font-display:swap;src:url("https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy-9Black.woff2") format("woff2"),url("https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy-9Black.woff") format("woff")}
@font-face{font-family:"Mr Dafoe";font-weight:400;font-style:normal;font-display:swap;src:url("https://cdn.jsdelivr.net/npm/@fontsource/mr-dafoe@5.3.0/files/mr-dafoe-latin-400-normal.woff2") format("woff2"),url("https://cdn.jsdelivr.net/npm/@fontsource/mr-dafoe@5.3.0/files/mr-dafoe-latin-400-normal.woff") format("woff")}
:root{
  --amber:#ff7a1a; --ink:#141210; --paper:#efe9df;
  --ko:"Paperlogy","Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;
  --num:var(--ko);
  --v:min(1vw,1.9vh); --pp:calc(var(--v)*3.4);
  --top:60px; --bot:58px; --side:clamp(14px,4.4vw,72px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:#0c0b0a;color:#ece5da;font-family:var(--ko);-webkit-font-smoothing:antialiased;word-break:keep-all;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img,video,svg{display:block}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* chrome */
.top{position:fixed;top:0;left:0;right:0;height:var(--top);display:flex;align-items:center;gap:14px;padding:0 var(--side);z-index:50}
.top b{font-size:16px;font-weight:800;letter-spacing:-.01em}
.top b span{font-family:var(--num);font-weight:600;font-size:12.5px;color:#6c655e;margin-left:8px;letter-spacing:.04em}
.top .sp{flex:1}
.tbtn{height:36px;padding:0 14px;border-radius:4px;font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.tbtn.ghost{border:1px solid #3a3530;color:#a39a90}
.tbtn.ghost[aria-pressed="true"]{color:#ece5da;border-color:var(--amber)}
.tbtn.cta{background:var(--amber);color:#1d0e03}
.bot{position:fixed;left:0;right:0;bottom:0;height:var(--bot);display:flex;align-items:center;gap:18px;padding:0 var(--side);z-index:50}
.chap{display:flex;gap:4px;flex:1;min-width:0}
.chap button{flex:var(--n) 1 0;min-width:0;text-align:left;padding:10px 0 0;border-top:3px solid #2c2825;font-size:12.5px;color:#6c655e;font-weight:600;white-space:nowrap;overflow:hidden;transition:color .2s,border-color .2s}
.chap button:hover{color:#ece5da}
.chap button.on{border-color:var(--amber);color:#ece5da}
.pgno{font-size:15px;font-weight:700;color:#a39a90;min-width:64px;text-align:right}
.pgno b{color:#ece5da}
.arw{position:fixed;top:50%;z-index:40;width:48px;height:48px;margin-top:-24px;border-radius:50%;background:#1a1816;border:1px solid #3a3530;font-size:20px;display:flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s,opacity .2s}
.arw:hover{background:var(--amber);border-color:var(--amber);color:#1d0e03}
.arw.prev{left:calc(var(--side) - 24px)}.arw.next{right:calc(var(--side) - 24px)}
.arw[disabled]{opacity:0;pointer-events:none}
.arw.nudge{animation:nudge 1.4s ease-in-out 3}
@keyframes nudge{50%{transform:translateX(8px);background:var(--amber);color:#1d0e03}}

/* book */
.book{position:fixed;top:var(--top);bottom:var(--bot);left:var(--side);right:var(--side);box-shadow:0 30px 80px -30px #000}
.spread{position:absolute;inset:0;visibility:hidden;pointer-events:none}
.spread.cur,.spread.anim{visibility:visible}
.spread.cur{pointer-events:auto}
.pg{position:absolute;top:0;bottom:0;width:50%;overflow:hidden;padding:var(--pp);display:flex;flex-direction:column;justify-content:space-between;background:var(--bg);color:var(--fg);backface-visibility:hidden}
.pg.l{left:0;transform-origin:right center}
.pg.r{left:50%;transform-origin:left center}
.pg.l::after,.pg.r::after{content:"";position:absolute;top:0;bottom:0;width:7%;pointer-events:none;z-index:6}
.pg.l::after{right:0;background:linear-gradient(90deg,transparent,rgba(0,0,0,.22))}
.pg.r::after{left:0;background:linear-gradient(270deg,transparent,rgba(0,0,0,.22))}
.t-dark{--bg:#1a1816;--fg:#ece5da;--sub:#a39a90;--ln:#3a3530;--ac:#ff7a1a;--on:#1d0e03}
.t-black{--bg:#0c0b0a;--fg:#ece5da;--sub:#a39a90;--ln:#2c2825;--ac:#ff7a1a;--on:#1d0e03}
.t-paper{--bg:#efe9df;--fg:#1b1917;--sub:#6d665e;--ln:#cfc6b8;--ac:#e2610a;--on:#fff}
.t-amber{--bg:#ff7a1a;--fg:#1d0e03;--sub:#5c2a0a;--ln:rgba(29,14,3,.28);--ac:#1d0e03;--on:#ff7a1a}
.tag{font-size:clamp(12.5px,calc(var(--v)*1.05),16px);font-weight:700;color:var(--sub);display:flex;justify-content:space-between;gap:12px;position:relative;z-index:3}
.tag i{font-style:normal;font-family:var(--num);font-stretch:80%}
.blk{position:relative;z-index:3}
.cap{font-size:clamp(15px,calc(var(--v)*1.5),24px);font-weight:700;letter-spacing:-.02em;line-height:1.35;margin-top:calc(var(--v)*1.2)}

.big2{font-weight:900;font-size:calc(var(--v)*4.6);letter-spacing:-.04em;line-height:1;margin-top:calc(var(--v)*2);white-space:nowrap}
.ast{display:block;color:var(--ac);font-weight:700;font-size:.8em;margin-top:.5em}
.cap small{display:block;font-size:.72em;font-weight:500;color:var(--sub);margin-top:.35em}
.huge{font-weight:900;font-size:calc(var(--v)*9.2);line-height:.9;letter-spacing:-.045em;white-space:nowrap}
.huge small{font-size:.4em;font-weight:800;letter-spacing:-.04em;margin-left:.08em}
.ttl{font-size:calc(var(--v)*5.2);font-weight:800;letter-spacing:-.055em;line-height:1.02}
.ttl.s{font-size:calc(var(--v)*4.1)}
.ttl.xs{font-size:calc(var(--v)*2.9);line-height:1.2}
.meta b{font-weight:800;color:var(--fg)}
.sig{font-family:"Mr Dafoe","Brush Script MT",cursive;font-style:italic;font-weight:400;font-size:.62em;letter-spacing:0;color:#4a423b;display:inline-block;transform:rotate(-7deg) translate(-.12em,.12em)}
.ttl small{font-size:.42em;font-weight:500;letter-spacing:-.03em;margin-left:.3em;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:10px;height:clamp(42px,calc(var(--v)*3.4),52px);padding:0 clamp(16px,calc(var(--v)*1.6),24px);border-radius:4px;font-size:clamp(14px,calc(var(--v)*1.1),16.5px);font-weight:750;background:var(--ac);color:var(--on);transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn.line{background:transparent;color:var(--fg);border:1.5px solid var(--fg)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:calc(var(--v)*2)}
.fill{position:absolute;inset:0;z-index:1}
.fill img,.fill video{width:100%;height:100%;object-fit:cover}

.shade::before{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,rgba(0,0,0,.5),transparent 30%,transparent 55%,rgba(0,0,0,.72))}
.onimg{color:#fff;--fg:#fff;--sub:rgba(255,255,255,.8)}

/* cover */
.cv-name{font-size:calc(var(--v)*9.5);font-weight:900;letter-spacing:-.06em;line-height:.95}
.cv-role{font-size:calc(var(--v)*2.1);font-weight:750;letter-spacing:-.03em;margin-top:calc(var(--v)*1.4)}
.cv-yr{font-family:var(--num);font-stretch:66%;font-weight:800;font-size:calc(var(--v)*4.2);line-height:1}
/* toc */
.toc{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr;gap:3px;background:var(--bg);z-index:1}
.toc button{position:relative;overflow:hidden;background:#211e1b;text-align:left}
.toc button:first-child{grid-column:span 2}
.toc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(.5) brightness(.6);transition:filter .3s,transform .5s}
.toc button:hover img{filter:none;transform:scale(1.04)}
.toc span{position:absolute;left:14px;right:10px;bottom:12px;font-size:clamp(14px,calc(var(--v)*1.5),22px);font-weight:800;letter-spacing:-.03em;color:#fff;line-height:1.15}
.toc span i{display:block;font-style:normal;font-family:var(--num);font-size:.72em;color:var(--amber);margin-bottom:2px}
.keys{display:flex;gap:8px;align-items:center;font-size:clamp(13px,calc(var(--v)*1.05),15px);color:var(--sub);margin-top:calc(var(--v)*1.6)}
.keys kbd{font:inherit;font-weight:700;border:1.5px solid var(--ln);border-radius:4px;padding:3px 9px;color:var(--fg)}
/* number visuals */
.bars{position:absolute;left:var(--pp);right:var(--pp);bottom:var(--pp);top:28%;display:flex;gap:1.6%;align-items:flex-end;z-index:2}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;text-align:center}
.bars b{font-family:var(--num);font-stretch:70%;font-size:clamp(10px,calc(var(--v)*1.05),15px);font-weight:700;margin-bottom:5px;opacity:0;transition:opacity .4s .9s}
.bars i{display:block;background:var(--fg);height:0;transition:height .9s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--i)*45ms)}
.bars div:nth-child(-n+3) i{background:var(--ac)}
.live .bars i{height:var(--h)}.live .bars b{opacity:1}
.dots{position:absolute;inset:var(--pp);display:grid;grid-template-columns:repeat(28,1fr);gap:3px;align-content:center;z-index:2}
.dots i{aspect-ratio:16/10;background:var(--ac);opacity:.1;border-radius:1px}
.live .dots i{animation:lit .3s forwards;animation-delay:calc(var(--i)*2.2ms)}
@keyframes lit{to{opacity:1}}
.sq{position:absolute;inset:var(--pp);display:grid;grid-template-columns:repeat(5,1fr);gap:calc(var(--v)*.9);align-content:center;z-index:2}
.sq i{position:relative;aspect-ratio:1;border:2px solid var(--ln);border-radius:3px;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:calc(var(--v)*2);color:var(--sub)}
.sq i b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:.78em;letter-spacing:-.03em;opacity:0}
.live .sq i{animation:sold .32s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*130ms + .35s)}
.live .sq i b{animation:soldt .32s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*130ms + .35s)}
@keyframes sold{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1);background:var(--amber);border-color:var(--amber);color:transparent}}
@keyframes soldt{from{opacity:0}to{opacity:1}}
.arrow-big{font-size:calc(var(--v)*5);font-weight:200;line-height:1}
/* brand */
.meta{font-size:clamp(12.5px,calc(var(--v)*1.05),16px);font-weight:600;color:var(--sub);margin-bottom:calc(var(--v)*.9)}
.thesis{font-size:clamp(15px,calc(var(--v)*1.6),25px);font-weight:700;letter-spacing:-.03em;line-height:1.35;margin-top:calc(var(--v)*1.3);max-width:20em}
.st{display:grid;grid-template-columns:repeat(3,auto);justify-content:start;margin-top:calc(var(--v)*2.2);border-top:1.5px solid var(--ln)}
.st div{padding:calc(var(--v)*1) calc(var(--v)*1.3) 0 0}
.st div+div{padding-left:calc(var(--v)*1.3);border-left:1.5px solid var(--ln)}
.st b{display:block;font-weight:800;font-size:clamp(15px,calc(var(--v)*1.75),28px);line-height:1.1;white-space:nowrap;letter-spacing:-.03em}
.st b u{text-decoration:none;color:var(--ac)}

.st span{display:block;font-size:clamp(11.5px,calc(var(--v)*.95),14.5px);color:var(--sub);margin-top:4px;line-height:1.3}
.fan{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:1}
.fan figure{position:relative;width:27%;aspect-ratio:9/16;background:#2c2825;border-radius:6px;overflow:hidden;box-shadow:0 20px 40px -12px rgba(0,0,0,.7);transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.fan figure:nth-child(1){transform:translateX(30%) rotate(-3deg) scale(.9)}
.fan figure:nth-child(2){z-index:2}
.fan figure:nth-child(3){transform:translateX(-30%) rotate(3deg) scale(.9)}
.live .fan figure:nth-child(1){transform:translateX(-6%) rotate(-6deg) scale(.94)}
.live .fan figure:nth-child(3){transform:translateX(6%) rotate(6deg) scale(.94)}
.fan img{width:100%;height:100%;object-fit:cover}
.fan figcaption{position:absolute;left:8px;bottom:8px;background:var(--amber);color:#1d0e03;font-family:var(--num);font-stretch:70%;font-weight:800;font-size:clamp(13px,calc(var(--v)*1.5),22px);padding:2px 8px;border-radius:3px}
.mos{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:3px;z-index:1;background:var(--bg)}
.mos img{width:100%;height:100%;object-fit:cover;background:#2c2825}
.duo{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:3px;z-index:1}
.duo img{width:100%;height:100%;object-fit:cover;background:#2c2825}
.kmap{position:absolute;inset:var(--pp);z-index:2;display:flex;align-items:center;justify-content:center}
.kmap svg{height:100%;max-width:100%}
.kmap .land{fill:var(--fg);opacity:.12}
.kmap .c{fill:var(--ac)}
.kmap .rg{fill:none;stroke:var(--ac);stroke-width:1.5;opacity:0}
.live .kmap .rg{animation:ping 1.6s ease-out infinite;animation-delay:calc(var(--i)*.25s)}
@keyframes ping{0%{opacity:.9;r:6}100%{opacity:0;r:26}}
.kmap text{fill:var(--fg);font-size:17px;font-weight:800}
.play{position:absolute;right:var(--pp);bottom:var(--pp);z-index:4;width:calc(var(--v)*5);height:calc(var(--v)*5);min-width:52px;min-height:52px;border-radius:50%;background:var(--amber);display:flex;align-items:center;justify-content:center}
.play svg{width:26%;fill:#1d0e03;margin-left:6%}
/* loop */
.loopw{position:absolute;inset:var(--pp);z-index:2;display:flex;flex-direction:column;justify-content:center;gap:calc(var(--v)*1.2)}
.loopw svg{width:100%;flex:1;min-height:0;overflow:visible}
.ring{fill:none;stroke:var(--ln);stroke-width:2}
.back{fill:none;stroke:var(--ac);stroke-width:2.5;stroke-dasharray:6 7}
.node{cursor:pointer}
.node circle{fill:var(--bg);stroke:var(--fg);stroke-width:2;transition:fill .2s}
.node text{fill:var(--fg);font-size:19px;font-weight:800}
.node .n{font-family:var(--num);font-size:22px}
.node.on circle{fill:var(--ac);stroke:var(--ac)}.node.on .n{fill:var(--on)}
.loopcap{min-height:3.2em;font-size:clamp(14px,calc(var(--v)*1.35),21px);font-weight:700;letter-spacing:-.02em;line-height:1.4;border-left:3px solid var(--ac);padding-left:14px}
.loopcap small{display:block;font-weight:500;color:var(--sub);font-size:.8em}
/* stage */
.wmap{position:absolute;inset:0;z-index:1;display:flex;align-items:center}
.wmap svg{width:100%;height:100%}
.wmap .land{fill:var(--fg);opacity:.1}
.wmap .arc{fill:none;stroke:var(--ac);stroke-width:2;stroke-dasharray:1000;stroke-dashoffset:1000}
.live .wmap .arc{transition:stroke-dashoffset 1.4s ease;transition-delay:calc(var(--i)*.18s);stroke-dashoffset:0}
.wmap .d{fill:var(--ac)}.wmap .h{fill:var(--fg)}
.wmap text{fill:var(--fg);font-size:26px;font-weight:800}
.trio{display:grid;grid-template-columns:repeat(3,auto);justify-content:start;gap:calc(var(--v)*3)}
.trio b{display:block;font-weight:900;font-size:calc(var(--v)*5.2);line-height:.95;letter-spacing:-.04em}
.trio b small{font-size:.42em;font-weight:800}
.trio span{font-size:clamp(12.5px,calc(var(--v)*1.1),16px);color:var(--sub);font-weight:600}
/* back */
.info{display:grid;grid-template-columns:1fr 1fr;align-items:start;gap:calc(var(--v)*1.6) calc(var(--v)*2.4);margin-top:calc(var(--v)*2)}
.info h4{font-size:clamp(12.5px,calc(var(--v)*1.05),15px);color:var(--ac);font-weight:800;margin-bottom:4px}
.info p{font-size:clamp(12.5px,calc(var(--v)*1.05),15px);color:var(--sub);line-height:1.55}
.me{display:flex;align-items:flex-end;gap:calc(var(--v)*1.6)}
.me figure{width:calc(var(--v)*11);aspect-ratio:4/5;background:var(--ln);border-radius:4px;overflow:hidden;flex:none}
.me img{width:100%;height:100%;object-fit:cover}

function loopSvg(){
  const C=260,R=170,pos=i=>{const a=(-90+i*72)*Math.PI/180;return [C+R*Math.cos(a),C+R*Math.sin(a),a];};
  let s=`<defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>`;
  for(let i=0;i<4;i++){const a1=(-90+i*72+15)*Math.PI/180,a2=(-90+(i+1)*72-15)*Math.PI/180;s+=`<path class="ring" d="M${C+R*Math.cos(a1)} ${C+R*Math.sin(a1)}A${R} ${R} 0 0 1 ${C+R*Math.cos(a2)} ${C+R*Math.sin(a2)}" marker-end="url(#ah)"/>`;}
  const [x5,y5]=pos(4),[x3,y3]=pos(2);
  s+=`<path class="back" d="M${x5+30} ${y5+8}Q${C-10} ${C+20} ${x3-22} ${y3-26}" marker-end="url(#ah)"/>`;
  STEPS.forEach((st,i)=>{const [x,y,a]=pos(i),lx=x+Math.cos(a)*50,ly=y+Math.sin(a)*52,anc=Math.abs(Math.cos(a))<.3?'middle':(Math.cos(a)>0?'start':'end');
    s+=`<g class="node" data-i="${i}" tabindex="0" role="button" aria-label="${i+1}단계 ${st[0]}"><circle cx="${x}" cy="${y}" r="30"/><text class="n" x="${x}" y="${y+8}" text-anchor="middle">${i+1}</text><text x="${lx}" y="${ly+6}" text-anchor="${anc}">${st[0]}</text></g>`;});
  return `<svg viewBox="-70 20 660 480" role="group" aria-label="일하는 방식 5단계">${s}</svg>`;
}
function worldSvg(){
  const W=MAPS.world,P=W.pts,[hx,hy]=P.kr;
  const lab={ch:['스위스',18,10,'start'],cn:['중국',-16,-18,'end'],vn:['베트남',-18,8,'end'],tw:['대만',18,26,'start'],sg:['싱가포르',-18,8,'end']};
  let s=`<path class="land" d="${W.d}"/>`;
  Object.keys(lab).forEach((k,i)=>{const [x,y]=P[k],mx=(x+hx)/2,my=Math.min(y,hy)-Math.hypot(x-hx,y-hy)*.28;s+=`<path class="arc" style="--i:${i}" d="M${hx} ${hy}Q${mx} ${my} ${x} ${y}"/>`;});
  Object.entries(lab).forEach(([k,[t,dx,dy,a]])=>{const [x,y]=P[k];s+=`<circle class="d" cx="${x}" cy="${y}" r="9"/><text x="${x+dx}" y="${y+dy}" text-anchor="${a}">${t}</text>`;});
  s+=`<circle class="h" cx="${hx}" cy="${hy}" r="9"/><text x="${hx+16}" y="${hy-12}">서울</text>`;
  return `<svg viewBox="130 70 800 440" role="img" aria-label="해외 무대: 스위스, 중국, 베트남, 대만, 싱가포르">${s}</svg>`;
}

let sndOn=false, actx=null;
function flipSound(){
  if(!sndOn) return;
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const d=.28,n=actx.sampleRate*d,buf=actx.createBuffer(1,n,actx.sampleRate),ch=buf.getChannelData(0);
    for(let i=0;i<n;i++){const t=i/n; ch[i]=(Math.random()*2-1)*Math.pow(Math.sin(Math.PI*t),2)*(.5+.5*Math.sin(t*40));}
    const src=actx.createBufferSource(); src.buffer=buf; const f=actx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=2600; f.Q.value=.7; const g=actx.createGain(); g.gain.value=.22;
    src.connect(f).connect(g).connect(actx.destination); src.start(); }catch(e){}
}
$('#snd').addEventListener('click',e=>{ sndOn=!sndOn; e.currentTarget.setAttribute('aria-pressed',sndOn); e.currentTarget.textContent=sndOn?'넘김 소리 끄기':'넘김 소리 켜기'; flipSound(); });

/* ── page life ── */
function countUp(el){
  const to=+el.dataset.count, from=+(el.dataset.from||0), suf=el.dataset.suf||''; if(reduce){return;}
  const t0=performance.now(), D=1100;
  (function f(t){const p=Math.min(1,(t-t0)/D), e=1-Math.pow(1-p,3); el.innerHTML=Math.round(from+(to-from)*e).toLocaleString('ko-KR')+suf; if(p<1) requestAnimationFrame(f);})(t0);
}
function enter(sp){ sp.classList.add('live'); sp.setAttribute('aria-hidden','false'); $$('video:not([data-still])',sp).forEach(v=>{const p=v.play(); if(p&&p.catch) p.catch(()=>{});}); $$('[data-yt]',sp).forEach(w=>{ if(reduce||$('iframe',w)) return; const v=w.dataset.yt, f=document.createElement('iframe'); f.allow='autoplay; encrypted-media'; f.tabIndex=-1; f.title=''; f.setAttribute('aria-hidden','true'); f.src=`https://www.youtube-nocookie.com/embed/${v}?autoplay=1&mute=1&controls=0&rel=0&playsinline=1&loop=1&playlist=${v}&modestbranding=1&disablekb=1&fs=0`; $('.ytf',w).appendChild(f); setTimeout(()=>{ if(f.isConnected) f.classList.add('on'); },900); }); $$('[data-count]',sp).forEach(countUp); if($('#loopcap',sp)) loopStart(); }
function leave(sp){ sp.classList.remove('live'); sp.setAttribute('aria-hidden','true'); $$('video',sp).forEach(v=>v.pause()); $$('[data-yt] iframe',sp).forEach(f=>f.remove()); if($('#loopcap',sp)) loopStop(); }

let cur=0, busy=false;
const P='perspective(2600px) ';
function ui(){
  $('#pn').textContent=cur+1; $('#prev').disabled=cur===0; $('#next').disabled=cur===N-1;
  $$('#chap button').forEach((b,i)=>b.classList.toggle('on', cur>=CH[i].at && cur<CH[i].at+CH[i].len));
  try{ history.replaceState(null,'','#'+(cur+1)); }catch(e){}
}
function done(A,B,n){ A.classList.remove('cur','anim'); B.classList.remove('anim'); B.classList.add('cur'); [A,B].forEach(s=>{s.style.zIndex=''; $$('.pg',s).forEach(p=>p.style.visibility='');}); leave(A); cur=n; busy=false; enter(B); ui(); }
function go(n){
  if(busy||n===cur||n<0||n>=N||galOpen) return;
  const A=S[cur], B=S[n], fwd=n>cur; busy=true; $('#next').classList.remove('nudge'); flipSound();
  B.classList.add('anim');
  if(reduce){ done(A,B,n); return; }
  const half=360;
  if(isM()){
    const top=fwd?A:B, bot=fwd?B:A; top.style.zIndex=3; bot.style.zIndex=1;
    const kf=[{transform:P+'rotateY(0deg)',filter:'brightness(1)'},{transform:P+'rotateY(-92deg)',filter:'brightness(.5)'}];
    top.animate(fwd?kf:kf.slice().reverse(),{duration:560,easing:fwd?'cubic-bezier(.5,0,.9,.6)':'cubic-bezier(.1,.4,.5,1)'}).onfinish=()=>done(A,B,n);
    return;
  }
  A.style.zIndex=2; B.style.zIndex=1;
  const a=$(fwd?'.pg.r':'.pg.l',A), b=$(fwd?'.pg.l':'.pg.r',B), d=fwd?-1:1;
  b.style.visibility='hidden';
  a.animate([{transform:P+'rotateY(0deg)',filter:'brightness(1)'},{transform:P+`rotateY(${90*d}deg)`,filter:'brightness(.45)'}],{duration:half,easing:'cubic-bezier(.45,0,.9,.55)'}).onfinish=()=>{
    a.style.visibility='hidden'; B.style.zIndex=3; b.style.visibility='';
    b.animate([{transform:P+`rotateY(${-90*d}deg)`,filter:'brightness(.45)'},{transform:P+'rotateY(0deg)',filter:'brightness(1)'}],{duration:half,easing:'cubic-bezier(.1,.45,.4,1)'}).onfinish=()=>done(A,B,n);
  };
}
const next=()=>go(cur+1), prev=()=>go(cur-1);
$('#next').addEventListener('click',next); $('#prev').addEventListener('click',prev);
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){ go(+g.dataset.go); return; }
  const b=e.target.closest('[data-brand]'); if(b){ go(brandAt(b.dataset.brand)); return; }

});
document.addEventListener('keydown',e=>{
  if($('#lb').classList.contains('open')){ if(e.key==='Escape') closeLb(); return; }
  if(galOpen){ if(e.key==='Escape') closeGal(); return; }
  if(e.key==='ArrowRight'||e.key==='PageDown'||(e.key===' '&&!e.target.closest('button,a'))){ e.preventDefault(); next(); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); prev(); }
  else if(e.key==='Home') go(0); else if(e.key==='End') go(N-1);
});
let wheelT=0;
addEventListener('wheel',e=>{
  if($('#lb').classList.contains('open')) return;
  if(galOpen){ const st=$('.strip'); if(st&&Math.abs(e.deltaY)>Math.abs(e.deltaX)){ st.scrollLeft+=e.deltaY; e.preventDefault(); } return; }
  if(e.target.closest&&e.target.closest('.hist')) return;
  e.preventDefault(); const now=Date.now(); const d=Math.abs(e.deltaY)>Math.abs(e.deltaX)?e.deltaY:e.deltaX;
  if(Math.abs(d)<24||now-wheelT<950) return; wheelT=now; d>0?next():prev();
},{passive:false});

book.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});

function openHist(){
  const el=$('#gal'), T={해외:'해외 활동',수상:'수상',방송:'방송',공연:'주요 공연'}; galFrom=document.activeElement;
  el.innerHTML=`<div class="gal-h"><h3>무대 이력</h3><span>비보이 18년</span><button class="gal-x" type="button" aria-label="닫기">×</button></div><div class="hist">${['해외','수상','방송','공연'].map(c=>`<section><h4>${T[c]}</h4><ul>${EVENTS.filter(e=>e[0]===c).map(e=>`<li><b>${e[1]}</b><span>${e[2]}</span></li>`).join('')}</ul></section>`).join('')}</div>`;
  el.classList.add('open'); galOpen=true; $('.gal-x',el).focus(); $('.gal-x',el).addEventListener('click',closeGal);
}
function closeGal(){ const el=$('#gal'); el.classList.remove('open'); el.innerHTML=''; galOpen=false; if(galFrom) galFrom.focus(); }
const lb=$('#lb');
function closeLb(){ lb.classList.remove('open','fit'); }
document.addEventListener('click',e=>{ const z=e.target.closest('.zoom'); if(!z||!$('img',z)) return; $('img',lb).src=z.dataset.src; lb.classList.toggle('fit',!!z.dataset.fit); lb.classList.add('open'); lb.scrollTop=0; });
lb.addEventListener('click',e=>{ if(e.target.tagName!=='IMG') closeLb(); });

/* ── start ── */
const h=parseInt(location.hash.slice(1),10); if(h>=1&&h<=N) cur=h-1;
S[cur].classList.add('cur'); enter(S[cur]); ui();
if(cur===0) $('#next').classList.add('nudge');
})();

</script>
</body>
</html>
