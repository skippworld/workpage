@font-face{font-family:"Paperlogy";font-weight:100;font-style:normal;font-display:swap;src:url("https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy-1Thin.woff2") format("woff2"),url("https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy-1Thin.woff") format("woff")}

@font-face{font-family:"Paperlogy";font-weight:600;font-style:normal;font-display:swap;src:url("https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy-6SemiBold.woff2") format("woff2"),url("https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy-6SemiBold.woff") format("woff")}
@font-face{font-family:"Paperlogy";font-weight:700;font-style:normal;font-display:swap;src:url("https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy-7Bold.woff2") format("woff2"),url("https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy-7Bold.woff") format("woff")}
@font-face{font-family:"Paperlogy";font-weight:800;font-style:normal;font-display:swap;src:url("https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy-8ExtraBold.woff2") format("woff2"),url("https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy-8ExtraBold.woff") format("woff")}
@font-face{font-family:"Paperlogy";font-weight:900;font-style:normal;font-display:swap;src:url("https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy-9Black.woff2") format("woff2"),url("https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy-9Black.woff") format("woff")}
@font-face{font-family:"Mr Dafoe";font-weight:400;font-style:normal;font-display:swap;src:url("https://cdn.jsdelivr.net/npm/@fontsource/mr-dafoe@5.3.0/files/mr-dafoe-latin-400-normal.woff2") format("woff2"),url("https://cdn.jsdelivr.net/npm/@fontsource/mr-dafoe@5.3.0/files/mr-dafoe-latin-400-normal.woff") format("woff")}
:root{
  --o:#ff6a13; --o2:#ff9a52; --ink:#141210; --mute:#6f6861; --line:#e7e2dc; --wash:#f6f3ef;
  --amber:var(--o);
  --ko:"Paperlogy","Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;
  --num:var(--ko);
  --top:64px; --bot:0px; --side:0px;
  --pad:clamp(20px,5vw,96px);
  --E:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:auto}
html.lock{overflow:hidden}
body{background:#fff;color:var(--ink);font-family:var(--ko);-webkit-font-smoothing:antialiased;word-break:keep-all;line-height:1.5;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
img,video{display:block}
:focus-visible{outline:2px solid var(--o);outline-offset:3px}

/* top */
.top{position:fixed;top:0;left:0;right:0;height:var(--top);z-index:50;transition:transform .35s var(--E);display:flex;align-items:center;gap:10px;padding:0 var(--pad);background:rgba(255,255,255,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.top>b{font-size:17px;font-weight:800;letter-spacing:-.01em}
.top>b span{font-weight:500;font-size:12.5px;color:var(--mute);margin-left:8px;letter-spacing:.04em}
.top nav{flex:1;display:flex;justify-content:center;gap:4px}
.top nav a{font-size:14px;font-weight:600;color:var(--mute);padding:8px 12px;border-radius:999px}
.top nav a:hover{color:var(--ink);background:var(--wash)}
.tbtn{height:38px;padding:0 15px;border-radius:4px;font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;white-space:nowrap}
.tbtn.pdf2{border:1px solid var(--o);color:var(--o)}
.tbtn.pdf2:hover{background:rgba(255,106,19,.08)}
.tbtn.cta{background:var(--o);color:#1d0e03}
#prog{position:fixed;left:0;right:0;top:0;height:3px;z-index:51;background:var(--ink);transform-origin:0 50%;transform:scaleX(0);pointer-events:none}
.top.hide{transform:translateY(-100%)}

/* media placeholder */
.m{position:relative;overflow:hidden;background:#e9e5e0;isolation:isolate;width:100%;height:100%}
.m img,.m video{position:relative;z-index:1;width:100%;height:100%;object-fit:cover}
.src{font-style:normal;position:absolute;inset:0;z-index:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px;text-align:center;font-size:12px;line-height:1.35;color:#9a928a;word-break:break-all}
.src b{font-weight:700;color:#7d756d}

/* scene engine */
:root{--sh:100vh}
@supports (height:100svh){:root{--sh:100svh}}
html.snapon{scroll-snap-type:y mandatory}
.sc{position:relative;height:calc(var(--len) / 100 * var(--sh))}
.snap{position:absolute;left:0;width:1px;height:var(--sh);scroll-snap-align:start;scroll-snap-stop:always;pointer-events:none;opacity:0}
#proof{scroll-snap-align:start}
.stk{position:sticky;top:0;height:var(--sh);overflow:hidden;padding:calc(var(--top) + 2.5vh) var(--pad) 4vh}
.st{opacity:0;transform:translateY(26px);transition:opacity .5s ease var(--d,0s),transform .75s var(--E) var(--d,0s)}
.st.on{opacity:1;transform:none}
.only{pointer-events:none}
.only.on{pointer-events:auto}
.sh-k{font-size:15px;font-weight:700;color:var(--o)}
.rise{position:absolute;left:0;right:0;bottom:0;height:140%;pointer-events:none;background:linear-gradient(to top,var(--o) 0,var(--o) 62%,var(--o2) 78%,rgba(255,154,82,0) 100%);transform:translateY(calc((1 - var(--f,0)) * 100%));will-change:transform}
h2{font-weight:800;letter-spacing:-.035em;line-height:1.08}

/* ① hook */
.hook{--f:clamp(0, calc((var(--p) - .3) / .6), 1)}
.hook .stk{display:flex;flex-direction:column;justify-content:center}
.hk{position:relative;display:grid}
.hk>*{grid-area:1/1}
.hk-l{align-self:start;font-size:16px;font-weight:600;color:var(--mute);margin-top:-1.4em;transform:translateY(-100%)}
.hk-l.on{transform:translateY(-100%)}
.hk-big{font-size:min(9.4vw,15.5vh);font-weight:800;letter-spacing:-.05em;line-height:1.02;transition:opacity .6s,transform .8s var(--E)}
.hk-big>span{display:block}
.hk-big>span:nth-child(3) i{font-style:normal;color:var(--o);margin:0 .12em;transition:color .4s}
.hk-big .cnt{font-weight:800;font-variant-numeric:tabular-nums}
.hk-big .plus{font-style:normal;display:inline-block;color:var(--ink);transition:transform .5s var(--E),color .3s}
.hk-big .hit .plus{color:#fff;transform:scale(1.25) translateY(-4%)}
.hk-big>span.hit{animation:hitp .7s var(--E)}
@keyframes hitp{40%{transform:scale(1.03)}}


.hk-end{align-self:center;font-size:min(8.4vw,14vh);font-weight:800;letter-spacing:-.05em;line-height:1.04}
.hk-me{align-self:end;justify-self:start;font-size:clamp(16px,1.6vw,22px);font-weight:600;margin-top:2em;transform:translateY(calc(100% + 3vh))}
.hk-me.on{transform:translateY(calc(100% + 3vh))}
.cue{position:absolute;left:var(--pad);bottom:4vh;display:flex;align-items:center;gap:12px;font-size:13px;font-weight:600;color:var(--mute);transition:opacity .4s}
.cue i{width:1px;height:46px;background:var(--line);position:relative;overflow:hidden}
.cue i::after{content:"";position:absolute;left:0;top:-40%;width:1px;height:40%;background:var(--ink);animation:cue 1.8s var(--E) infinite}
@keyframes cue{to{top:100%}}
.hook[data-step="1"] .cue,.hook[data-step="2"] .cue{opacity:0}

/* ② hello */
.hello .stk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,5vw,90px);align-items:center}
.drain{position:absolute;left:0;right:0;top:0;height:120%;z-index:3;pointer-events:none;background:linear-gradient(to bottom,var(--o) 0,var(--o) 80%,rgba(255,106,19,0) 100%);transform:translateY(100%)}
.hello[data-step="0"] .drain{animation:drain 1.1s var(--E) both}
@keyframes drain{from{transform:translateY(0)}to{transform:translateY(100%)}}
.hl-m{position:relative;height:min(78vh,62vw);display:grid;overflow:hidden}
.hl-m>.only{height:100%;min-height:0}
.hl-m>.only{grid-area:1/1;opacity:0;transform:scale(1.04);transition:opacity .7s ease,transform 1.1s var(--E)}
.hl-m>.only.on{opacity:1;transform:none}
.hl-t{display:grid;align-items:center}
.hl-t>.only{grid-area:1/1}
.hl-t h2{font-size:clamp(34px,4.4vw,72px)}
.hl-t p{margin-top:1.3em;font-size:clamp(16px,1.35vw,21px);color:var(--mute);line-height:1.65}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{font-size:14px;font-weight:700;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 13px;background:#fff}
.dots4{position:absolute;right:var(--pad);bottom:5vh;display:flex;gap:6px;list-style:none}
.dots4 li{width:22px;height:3px;background:var(--line);transition:background .4s}
.hello[data-step="0"] .dots4 li:nth-child(-n+1),.hello[data-step="1"] .dots4 li:nth-child(-n+2),.hello[data-step="2"] .dots4 li{background:var(--o)}

/* ③ industries */
.ind{--f:calc(clamp(0, var(--p), 1) * .22)}
.ind .stk{display:flex;flex-direction:column;gap:3.2vh}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
.sh>.sw{display:none}
.sh h2{font-size:clamp(30px,3.6vw,60px)}
.ind:not([data-step="6"]) .sh>.sw.first,.ind[data-step="6"] .sh>.sw:nth-child(2){display:block}
.sh .sh-k{font-size:15px;color:var(--mute);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;transition:opacity .5s,transform .6s var(--E)}

.card{display:flex;flex-direction:column;gap:6px;width:100%;position:relative;background:#fff}
.card .m{aspect-ratio:4/5;height:auto;transition:transform .5s var(--E)}
.card:hover .m{transform:translateY(-4px)}
.ck{font-size:13px;font-weight:700;color:var(--o);margin-top:6px}
.card>b{font-size:clamp(15px,1.25vw,20px);font-weight:800;letter-spacing:-.02em;line-height:1.25}
.cr{font-size:clamp(12.5px,.95vw,15px);color:var(--mute);line-height:1.5}
.formula{list-style:none;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-top:2px solid var(--ink)}
.formula li{padding:14px 14px 0 0;position:relative}
.formula li i{font-style:normal;font-size:13px;font-weight:800;color:var(--o)}
.formula li b{display:block;font-size:clamp(15px,1.3vw,21px);font-weight:800;margin-top:2px}
.formula li span{display:block;font-size:13px;color:var(--mute);margin-top:4px;line-height:1.45}
.formula li.back b{color:var(--o)}
/* formula: stagger, draw, loop pulse */
.ind .formula{border-top:0;gap:0}
.formula li{opacity:0;transform:translateY(30px);transition:opacity .5s ease calc(var(--i) * .16s + .2s),transform .7s var(--E) calc(var(--i) * .16s + .2s);padding:22px 18px 0 0}
.formula li::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--ink);transform:scaleX(0);transform-origin:0 50%;transition:transform .5s var(--E) calc(var(--i) * .16s + .3s)}
.formula li:not(:last-child)::after{content:"→";position:absolute;right:6px;top:22px;font-size:20px;font-weight:800;color:var(--o);opacity:0;transition:opacity .4s calc(var(--i) * .16s + .6s)}
.formula li i{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;font-size:15px;transform:scale(0);transition:transform .5s cubic-bezier(.3,1.6,.5,1) calc(var(--i) * .16s + .35s)}
.formula li b{font-size:clamp(18px,1.7vw,28px);margin-top:10px}
.formula li span{font-size:clamp(13px,1vw,15px)}
.formula li.back i{background:var(--o);color:#1d0e03;font-size:18px}
.formula.on li,.st.on>.formula li{opacity:1;transform:none}
.st.on>.formula li::before{transform:scaleX(1)}
.st.on>.formula li::after{opacity:1}
.st.on>.formula li i{transform:none}
.st.on>.formula li{animation:fpulse 6s ease-in-out infinite;animation-delay:calc(var(--i) * 1s + 1.6s)}
.st.on>.formula li.back i{animation:fspin 6s ease-in-out infinite;animation-delay:6.6s}
@keyframes fpulse{0%,14%,100%{background:transparent}4%,10%{background:rgba(255,106,19,.14)}}
@keyframes fspin{0%,8%{transform:none}14%,100%{transform:rotate(-360deg)}}
.ind[data-step="6"] .cards{opacity:.12;filter:grayscale(1);transform:translateY(-6px) scale(.97)}

/* ④ system */
.sys{--f:clamp(0, calc((var(--p) - .5) / .4), 1)}
.sys .stk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(24px,5vw,90px);align-items:center}
.sy-t{position:relative;z-index:1;display:grid;grid-template-rows:auto auto auto}
.sy-t>.sh-k,.sy-t>h2{grid-column:1}
.sy-t>.only{grid-row:3;grid-column:1}
.sy-t .sum b{display:block;font-size:clamp(22px,2vw,34px);font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.docs{position:relative;display:grid;align-items:center}
.docs>*{grid-area:1/1}
.spec{transition:transform .9s var(--E),opacity .6s,filter .6s}
.sys[data-step="1"] .spec{transform:rotate(-4deg) translate(-6%,-10%) scale(.82);opacity:.45;filter:blur(1px)}
.mans{position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-self:end;margin-bottom:-2vh;pointer-events:none}
.man{background:#fff;border:1px solid var(--line);border-top:5px solid var(--ink);padding:18px 16px 14px;box-shadow:0 30px 60px -30px rgba(20,18,16,.45);display:flex;flex-direction:column;gap:12px;min-height:min(42vh,360px);transform:translateY(60px) rotate(var(--rt,0deg));transition:opacity .5s,transform .9s var(--E)}
.man.on{transform:rotate(var(--rt,0deg))}
.man0{--rt:-2.5deg;transition-delay:0s}.man1{--rt:0deg;transition-delay:.12s}.man2{--rt:2.5deg;transition-delay:.24s}
.man1{border-top-color:var(--o)}
.mt{font-size:clamp(16px,1.35vw,21px);font-weight:800;line-height:1.25;letter-spacing:-.02em}
.mt small{display:block;font-size:12px;font-weight:700;color:var(--o);margin-bottom:4px}
.man ul{list-style:none;display:flex;flex-direction:column;gap:7px;flex:1}
.man li{font-size:clamp(12.5px,.95vw,14.5px);line-height:1.45;padding-left:12px;position:relative}
.man li::before{content:"";position:absolute;left:0;top:.6em;width:5px;height:5px;background:var(--o)}
.mp{font-size:11.5px;color:var(--mute);border-top:1px solid var(--line);padding-top:8px;display:flex;justify-content:space-between;gap:6px}
.mp em{font-style:normal;font-weight:800;color:var(--ink)}
.sy-t h2{font-size:clamp(34px,4.2vw,72px);margin-top:.3em}
.sy-t p:not(.sh-k){max-width:30em;margin-top:1.4em;font-size:clamp(15px,1.25vw,19px);line-height:1.7;color:var(--ink)}
.spec{position:relative;z-index:1;background:#fff;color:var(--ink);padding:clamp(22px,2.6vw,44px);box-shadow:0 1px 0 var(--line),0 40px 80px -40px rgba(20,18,16,.35);border:1px solid var(--line);transform:rotate(-1.2deg)}
.spec h5{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:clamp(17px,1.5vw,24px);font-weight:800;border-bottom:2px solid var(--ink);padding-bottom:12px}
.spec h5 small{font-size:.6em;font-weight:600;color:var(--mute);margin-left:4px}
.spec .v{font-size:.9em;color:var(--o)}
.spec ol{list-style:none;counter-reset:r}
.spec li{counter-increment:r;display:flex;gap:16px;align-items:baseline;padding:clamp(9px,1.25vh,15px) 0;border-bottom:1px solid var(--line);font-size:clamp(15px,1.3vw,21px)}
.spec li::before{content:counter(r);font-size:.78em;font-weight:800;color:var(--o);width:1.2em}
.spec li b{font-weight:800}
.stamp{position:absolute;right:6%;bottom:-18px;font-size:14px;font-weight:800;color:var(--o);border:2px solid var(--o);border-radius:999px;padding:6px 16px;background:#fff;transform:rotate(-6deg)}

/* ⑤ team */
.team .stk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,5vw,90px);align-items:center;background:var(--wash)}
.tm-t h2{font-size:clamp(38px,5vw,84px);margin-top:.35em}
.tm-t h2 .st{display:inline}
.tm-t h2 .st:not(.on){opacity:.12;transform:none}
.up{display:flex;align-items:center;gap:12px;font-size:clamp(15px,1.3vw,20px);font-weight:700;margin-top:14px;color:var(--mute)}
.up i{font-style:normal;color:var(--o)}
.up b.st{color:var(--ink);background:var(--o);padding:2px 10px}
.tm-t>p.st{margin-top:1.3em;font-size:clamp(15px,1.25vw,19px);line-height:1.7;color:var(--mute)}
.org{display:flex;flex-direction:column;align-items:center}
.org>.st{display:flex;flex-direction:column;align-items:center;width:100%}
.bx{background:#fff;border:1px solid var(--line);padding:14px 22px;text-align:center;font-weight:800;font-size:clamp(16px,1.4vw,22px);min-width:min(320px,80%)}
.bx small{display:block;font-size:13px;font-weight:500;color:var(--mute);margin-top:2px}
.bx.lead{background:var(--ink);color:#fff;border-color:var(--ink)}
.bx.lead small{color:#bdb5ab}
.bx.doc{border:2px dashed var(--o)}
.ln{width:2px;height:clamp(14px,3vh,34px);background:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(560px,100%)}
.two .bx{min-width:0}
.bx.res{display:grid;grid-template-columns:1fr 1fr;padding:0;background:var(--o);border-color:var(--o);width:min(560px,100%)}
.bx.res>div{padding:14px 10px}
.bx.res>div+div{border-left:1px solid rgba(20,18,16,.2)}
.bx.res b{font-size:clamp(24px,2.4vw,38px);letter-spacing:-.03em}
.bx.res small{color:var(--ink)}

/* ⑥ touchpoints */
.touch{--f:clamp(0, calc((var(--p) - .82) / .16), 1)}
.touch .stk{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(24px,5vw,90px);align-items:center}
.to-t{position:relative;z-index:1}
.to-t h2{font-size:clamp(30px,3.6vw,60px);margin-top:.35em}
.path{list-style:none;margin-top:4.5vh;position:relative}
.path::before{content:"";position:absolute;left:7px;top:10px;bottom:10px;width:2px;background:var(--line)}
.path li{display:flex;align-items:center;gap:16px;padding:7px 0;position:relative;opacity:.35;transform:none}
.path li.on{opacity:1}
.path li i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);background:#fff;transition:background .4s,border-color .4s}
.path li.on i{background:var(--o);border-color:var(--o)}
.path li b{font-size:clamp(16px,1.4vw,22px);font-weight:800}
.to-m{position:relative;z-index:1;display:grid;height:min(76vh,48vw)}
.to-m>.only{min-height:0;overflow:hidden}
.tp3 .m,.tp2 .m{max-height:52vh}
.tp3.tall .m,.tp2 .m{width:auto;max-width:100%}
.to-m>.only{grid-area:1/1;display:flex;flex-direction:column;justify-content:center;gap:14px;opacity:0;transform:translateY(30px);transition:opacity .5s,transform .7s var(--E)}
.to-m>.only.on{opacity:1;transform:none}
.to-m>.only>p{font-size:clamp(14px,1.15vw,18px);color:var(--mute)}
.to-m>.only>p b{display:block;color:var(--ink);font-size:clamp(18px,1.6vw,26px);font-weight:800}
.tp3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tp3 .m{aspect-ratio:16/9;height:auto}
.tp3.tall{grid-template-columns:repeat(3,minmax(0,170px));justify-content:start}
.tp3.tall .m{aspect-ratio:9/16}
.tp3.doc .m{aspect-ratio:4/3;background:#f1ede8}
.tp3.doc img{object-fit:contain}
.tp2{display:grid;grid-template-columns:repeat(2,minmax(0,200px));gap:14px}
.tp2 .m{aspect-ratio:450/845;height:auto}
.tp2 figcaption{font-size:13px;font-weight:700;color:var(--mute);margin-top:6px}
.tp2 .aft figcaption{color:var(--o)}
.fin p{font-size:clamp(18px,1.6vw,26px);font-weight:700}
.fin strong{display:block;font-size:clamp(40px,5vw,88px);font-weight:800;letter-spacing:-.04em;line-height:1.06;margin-top:.3em}

/* ⑦ days */
.days .stk{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr);gap:clamp(24px,5vw,90px);align-items:center}
.dy-t h2{font-size:clamp(40px,5vw,84px);margin-top:.35em}
.motto{margin-top:1.6em;font-size:clamp(17px,1.5vw,24px);font-weight:700;border-left:3px solid var(--o);padding-left:16px}
.dys{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,1.6vw,28px)}
.dys li{border-top:2px solid var(--ink);padding-top:18px;position:relative}
.dn{display:block;font-size:clamp(44px,4.6vw,80px);font-weight:800;letter-spacing:-.04em;line-height:1}
.dys li b{display:block;font-size:clamp(18px,1.6vw,26px);font-weight:800;color:var(--o);margin-top:10px}
.dys li p{font-size:clamp(14px,1.1vw,17px);color:var(--mute);margin-top:8px;line-height:1.6}
.dys .bar{position:absolute;left:0;top:-2px;height:2px;width:0;background:var(--o);transition:width .9s var(--E) .2s}
.dys li.on .bar{width:100%}

/* sections (normal scroll) */
.proof,.arch,.me{padding:16vh var(--pad) 12vh}
.ph h2{font-size:clamp(34px,4.4vw,72px);margin-top:.35em}
.ph-s{margin-top:1em;color:var(--mute);font-size:16px}
.ph{opacity:0;transform:translateY(30px);transition:opacity .7s,transform .9s var(--E)}
.ph.in{opacity:1;transform:none}
.pw{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,2vw,32px);margin-top:7vh}
.pv{border-top:2px solid var(--ink);padding-top:22px;display:flex;flex-direction:column;gap:22px}
.pv-n b{display:block;font-size:clamp(44px,4.6vw,78px);font-weight:800;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.pv-n b small{font-size:.5em;color:var(--mute)}
.pv-n span{display:block;font-size:16px;font-weight:700;margin-top:10px}
.pv-n span small{display:block;font-weight:500;color:var(--mute);font-size:14px;margin-top:2px}
.c20{transition:color .4s}
.c20.done{color:var(--o)}
.c20.done small{color:var(--ink)}
.d700{display:grid;grid-template-columns:repeat(35,1fr);gap:2px}
.d700 i{aspect-ratio:1;background:var(--line)}
.pv.in .d700 i{animation:fillo .25s ease forwards;animation-delay:calc(var(--i) * 2.2ms)}
@keyframes fillo{to{background:var(--o)}}
.s20{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.s20 i{aspect-ratio:1.25;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:clamp(12px,1vw,16px);font-weight:700;color:var(--mute);position:relative;overflow:hidden}
.s20 i b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--o);color:#1d0e03;font-weight:800;opacity:0;transform:scale(1.5)}
.pv.in .s20 i b{animation:stamp .32s var(--E) forwards;animation-delay:calc(350ms + var(--i) * 130ms)}
@keyframes stamp{to{opacity:1;transform:none}}
.b10{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;align-items:end;height:clamp(150px,16vw,240px)}
.b10>div{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}
.b10 i{width:100%;height:0;background:var(--o);transition:height 1s var(--E);transition-delay:calc(var(--i) * 70ms)}
.b10>div:nth-child(n+4) i{background:var(--ink)}
.pv.in .b10 i{height:var(--h)}
.b10 b{font-size:clamp(9px,.75vw,12px);font-weight:700;color:var(--mute);white-space:nowrap}

.bc:hover{box-shadow:0 30px 60px -36px rgba(20,18,16,.45)}
.arch{background:var(--wash)}
.bgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,1.8vw,28px);margin-top:7vh}
.bc{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);opacity:0;transform:translateY(30px);transition:opacity .6s,transform .8s var(--E),box-shadow .3s}
.bc.in{opacity:1;transform:none}
.bc:first-child{grid-column:span 2}
.bc:first-child .bc-m{aspect-ratio:21/9}
.bc-m{display:block;aspect-ratio:16/9;overflow:hidden}
.bc-m .m{transition:transform .8s var(--E)}
.bc:hover .bc-m .m{transform:scale(1.035)}
.bc-t{display:flex;flex-direction:column;padding:20px 22px 22px;flex:1}
.bc-k{font-size:13px;font-weight:700;color:var(--o)}
.bc-t>b{font-size:clamp(22px,1.9vw,30px);font-weight:800;letter-spacing:-.03em;margin-top:2px}
.bc-t>b small{font-size:.5em;color:var(--mute);font-weight:600;letter-spacing:0}
.bc-r{font-size:13.5px;color:var(--mute);margin-top:2px}
.bc-x{font-size:16px;font-weight:600;margin-top:12px}
.bc-s{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 20px;border-top:1px solid var(--line);padding-top:14px}
.bc-s>span{font-size:12px;color:var(--mute);line-height:1.35}
.bc-s b{display:block;font-size:clamp(14px,1.15vw,18px);color:var(--ink);font-weight:800;letter-spacing:-.02em}
.bc-s b u{text-decoration:none;color:var(--o)}
.bc .btn{margin-top:auto;align-self:flex-start}

.btn{display:inline-flex;align-items:center;height:48px;padding:0 22px;border-radius:5px;background:var(--o);color:#1d0e03;font-size:15px;font-weight:800;white-space:nowrap;transition:transform .25s}
.btn.line{background:transparent;border:1px solid currentColor}
.btn.ink{background:var(--ink);color:#fff}
.btn.ink.line{background:transparent;color:var(--ink);border-color:var(--ink)}
@property --ga{syntax:'<angle>';inherits:false;initial-value:0deg}
.btn.glow{position:relative;isolation:isolate}
.btn.glow::before{content:"";position:absolute;inset:-3px;border-radius:8px;padding:3px;background:conic-gradient(from var(--ga),transparent 0deg,transparent 250deg,rgba(255,255,255,.2) 290deg,#fff 340deg,var(--o) 360deg);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:gspin 2.6s linear infinite;pointer-events:none}
.btn.glow::after{content:"";position:absolute;inset:-3px;border-radius:8px;background:conic-gradient(from var(--ga),transparent 0deg,transparent 300deg,var(--o) 360deg);filter:blur(10px);opacity:.6;z-index:-1;animation:gspin 2.6s linear infinite;pointer-events:none}
.bc:hover .btn.glow{transform:translateY(-2px)}
.bc:hover .btn.glow::before,.bc:hover .btn.glow::after{animation-duration:1.2s}
@keyframes gspin{to{--ga:360deg}}

.stage{background:var(--ink);color:#f3eee8;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:100vh}
.sg-v{position:relative;min-height:60vh}
.sg-v .m{position:absolute;inset:0;background:#1e1b18}
.sg-v .src b{color:#8c847a}
.sg-t{padding:14vh var(--pad) 10vh;display:flex;flex-direction:column;gap:28px;opacity:0;transform:translateY(30px);transition:opacity .7s,transform .9s var(--E)}
.stage.in .sg-t{opacity:1;transform:none}
.sg-t h2{font-size:clamp(26px,2.6vw,42px)}
.sg-t .big{display:block;font-size:clamp(80px,9vw,160px);color:var(--o);line-height:.95;letter-spacing:-.05em}
.sg-t .big small{font-size:.4em;color:#f3eee8}
.trio{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #3a3530;padding-top:16px;gap:12px}
.trio b{font-size:clamp(30px,2.8vw,48px);font-weight:800;letter-spacing:-.03em}
.trio b small{font-size:.45em;color:#a39a90}
.trio span{display:block;font-size:13.5px;color:#a39a90}
.wmap svg{width:100%;height:auto;max-height:34vh}
.wmap .land{fill:#2a2622}
.wmap .arc{fill:none;stroke:var(--o);stroke-width:2;stroke-dasharray:600;stroke-dashoffset:600}
.stage.in .wmap .arc{transition:stroke-dashoffset 1.4s var(--E);transition-delay:calc(var(--i) * 140ms + .4s);stroke-dashoffset:0}
.wmap .d{fill:var(--o)}
.wmap .h{fill:#fff}
.wmap text{fill:#d9d1c7;font-size:22px;font-weight:700;font-family:var(--ko)}
.sg-t .btn{align-self:flex-start;color:#f3eee8}

.me{display:grid;grid-template-columns:minmax(0,.75fr) minmax(0,1.25fr);gap:clamp(24px,5vw,90px);align-items:start}
.me-p{aspect-ratio:4/5;opacity:0;transition:opacity .9s}
.me.in .me-p{opacity:1}
.me-t h2{font-size:clamp(40px,4.4vw,72px);margin-top:.3em}
.me-t h2 small{font-size:.32em;color:var(--mute);letter-spacing:.06em;font-weight:600}
.me-r{font-size:clamp(16px,1.3vw,20px);font-weight:700;margin-top:8px}
.me-t dl{display:grid;grid-template-columns:1fr 1fr;gap:26px 40px;margin-top:5vh}
.me-t dl>div{border-top:1px solid var(--line);padding-top:14px}
.me-t dt{font-size:14px;font-weight:800;color:var(--o)}
.me-t dd{font-size:15.5px;line-height:1.7;margin-top:6px}
.me-t dd .chips{margin-top:10px}

.end{background:var(--o);min-height:100vh;display:flex;align-items:center;padding:12vh var(--pad)}
.end-in{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:clamp(24px,5vw,90px);align-items:end;width:100%;opacity:0;transform:translateY(30px);transition:opacity .8s,transform 1s var(--E)}
.end.in .end-in{opacity:1;transform:none}
.end h2{font-size:clamp(38px,5vw,88px);color:#fff}
.end h2 span{color:var(--ink)}
.end h2 u{text-decoration:none;border-bottom:.08em solid currentColor}
.end-c{display:flex;flex-direction:column;gap:10px}
.mail{font-size:clamp(22px,2vw,32px);font-weight:800}
.tel{font-size:18px;font-weight:700}
.end-b{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.thx{margin-top:28px;font-size:clamp(28px,2.6vw,44px);font-weight:800;color:#fff;letter-spacing:-.03em}

/* gallery overlay (dark theater) */
#gal{--fg:#ece5da;--ac:var(--o);--sub:#8c847a;--ln:#2a2623;--bg:#0f0d0c}

@media (max-width:1100px){
  .bgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cards{grid-template-columns:repeat(3,minmax(0,1fr))}
  .card .m{aspect-ratio:16/10}
  .ind .stk{gap:2vh}
}
@media screen and (max-width:860px),screen and (orientation:portrait){
  :root{--top:56px}
  .top nav{display:flex;flex:none;justify-content:flex-end}
  .top nav a{display:none;font-size:13px;padding:6px 8px}
  .top nav a[href="#work"]{display:block;color:var(--ink)}
  .top>b{flex:1}
  .top>b span{display:none}
  .tbtn{height:34px;padding:0 11px;font-size:12.5px}
  .stk{padding:calc(var(--top) + 2.4vh) var(--pad) 3.5vh}
  .top.hide{transform:none}
  .hk-big{font-size:min(14.5vw,9.6vh)}
  .hk-end{font-size:min(13vw,8.6vh)}
  .hk-l{font-size:14px}
  .hello .stk,.sys .stk,.team .stk,.touch .stk,.days .stk{grid-template-columns:1fr;grid-template-rows:auto auto;align-content:center;gap:3.2vh}
  .hello .stk{align-content:start}
  .hl-m{height:40svh}
  .hl-t{align-items:start}
  .hl-t h2{font-size:min(8.4vw,4.6vh)}
  .hl-t p{font-size:14.5px;margin-top:.9em}
  .chips span{font-size:12.5px;padding:4px 10px}
  .dots4{bottom:3vh}
  .sh h2{font-size:min(7.6vw,4.2vh)}
  .sh .sh-k{display:none}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 10px}
  .card{display:grid;grid-template-columns:64px 1fr;grid-template-rows:auto auto auto;column-gap:10px;row-gap:0;align-items:start}
  .card .m{grid-row:1/4;aspect-ratio:1;height:auto}
  .ck{margin-top:0;font-size:12px}
  .card>b{font-size:14px}
  .cr{font-size:12px;line-height:1.4}
  .ind[data-step="6"] .cards{opacity:0}
  .ind .fwrap{position:absolute;left:var(--pad);right:var(--pad);top:calc(var(--top) + 2.5vh + min(7.6vw,4.2vh)*2.4 + 3vh);transform:none!important}
  .ind .formula{grid-template-columns:1fr;border-top-width:2px}
  .ind .formula li{transform:none!important}
  .ind .formula li i{transition:transform .4s ease calc(var(--i) * .16s + .3s)!important}
  .formula li{display:grid;grid-template-columns:44px 1fr;padding:10px 0;border-bottom:1px solid var(--line)}
  .formula li i{width:30px;height:30px;grid-row:1/3}
  .formula li::after{display:none}
  .formula li::before{height:2px}
  .formula li span{grid-column:2;margin-top:0;font-size:12.5px}
  .formula li b{margin-top:0;font-size:16px}
  .sy-t h2{font-size:min(9vw,5vh)}
  .sy-t p:not(.sh-k){font-size:13.5px;margin-top:.8em}
  .spec{padding:18px;transform:none}
  .sys[data-step="1"] .spec{opacity:0;transform:scale(.9)}
  .mans{grid-template-columns:1fr;gap:8px;align-self:start;margin:0}
  .man{min-height:0;padding:12px 14px;gap:6px;transform:translateY(40px);border-top-width:4px}
  .man.on{transform:none}
  .man ul{gap:3px}
  .man li{font-size:12px}
  .mp{display:none}
  .mt{font-size:15px}
  .spec li{font-size:14.5px;padding:7px 0}
  .tm-t h2{font-size:min(8.6vw,4.8vh)}
  .tm-t>p.st{font-size:13.5px;margin-top:.7em}
  .bx{padding:10px 14px;font-size:15px}
  .bx small{font-size:11.5px}
  .bx.res b{font-size:22px}
  .to-t h2{font-size:min(7.4vw,4.1vh)}
  .path{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:1.6vh}
  .path::before{display:none}
  .path li{padding:0;gap:6px}
  .path li i{width:10px;height:10px}
  .path li b{font-size:13.5px}
  .to-m{height:auto;min-height:0}
  .tp3.tall{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tp2{grid-template-columns:repeat(2,minmax(0,140px))}
  .fin strong{font-size:min(10vw,6vh)}
  .dy-t h2{font-size:min(9vw,5vh)}
  .motto{font-size:15px;margin-top:1em}
  .dys{grid-template-columns:1fr;gap:12px}
  .dys li{padding-top:10px;display:grid;grid-template-columns:72px 1fr;column-gap:10px}
  .dn{font-size:34px;grid-row:1/3}
  .dys li b{margin-top:0;font-size:17px}
  .dys li p{margin-top:2px;font-size:13.5px}
  .pw{grid-template-columns:1fr;gap:44px}
  .bgrid{grid-template-columns:1fr}
  .bc:first-child{grid-column:auto}
  .bc:first-child .bc-m{aspect-ratio:16/9}
  .stage{grid-template-columns:1fr}
  .sg-v{min-height:52vh}
  .sg-t{padding:8vh var(--pad)}
  .me{grid-template-columns:1fr}
  .me-p{max-width:340px}
  .me-t dl{grid-template-columns:1fr}
  .end-in{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  .st,.ph,.bc,.sg-t,.end-in,.hl-m>.only,.to-m>.only{transition:opacity .3s!important;transform:none!important}
  .btn.glow::before{animation:none;background:none;border:2px solid #fff}.btn.glow::after{display:none}
  .cue i::after{animation:none}
}
#gal .gp .hist{display:grid}
#gal .gp .hist ul{list-style:none}
#gal .gp .hist h4{font-weight:800;border-bottom:3px solid var(--o)}
#gal .gp .hist li{display:grid;gap:8px;border-bottom:1px solid #2c2825;color:#cfc6b8}
#gal .gp .hist li b{color:var(--o);font-weight:800}

.hl-note{color:var(--ink)!important;font-weight:700;border-left:3px solid var(--o);padding-left:12px}
.path li{opacity:.35;transition:opacity .4s}
.path li.on{opacity:1}
.path li.cur b{color:var(--o)}
.to-m>.tc{grid-area:1/1;display:flex;flex-direction:column;justify-content:center;gap:14px;opacity:0;transform:translateY(30px);transition:opacity .5s,transform .7s var(--E);pointer-events:none}
.to-m>.tc.on{opacity:1;transform:none;pointer-events:auto}
.to-m>.tc>p{font-size:clamp(14px,1.15vw,18px);color:var(--mute)}
.to-m>.tc>p b{display:block;color:var(--ink);font-size:clamp(18px,1.6vw,26px);font-weight:800}
/* 자동 재생 */
.auto{position:fixed;right:max(18px,calc(var(--pad) - 20px));bottom:22px;z-index:55;display:flex;align-items:center;gap:10px;height:50px;padding:0 20px 0 8px;border-radius:999px;background:var(--ink);color:#fff;font-size:15px;font-weight:800;box-shadow:0 14px 30px -14px rgba(20,18,16,.6);transition:transform .25s,background .25s}
.auto:hover{transform:translateY(-2px)}
.auto .ai{position:relative;width:36px;height:36px;border-radius:50%;background:var(--o);display:flex;align-items:center;justify-content:center}
.auto .ai svg{width:13px;fill:#1d0e03}
.auto .ai .pz{display:none}
.auto.on .ai .pl0{display:none}
.auto.on .ai .pz{display:block}
.auto .ring{position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(#fff calc(var(--ap,0) * 1turn),transparent 0);-webkit-mask:radial-gradient(circle,transparent 17px,#000 18px);mask:radial-gradient(circle,transparent 17px,#000 18px);opacity:0}

/* 접점: 목록 강조 */
.path li.st{opacity:0;transform:translateX(-14px)}

/* 무대: 줄 단위 등장 */

.stage.in .sg-t .hm>span{transform:none}

.stage.in .sg-t .hm:nth-child(3)>span{transition-delay:.27s}

/* 마지막 장 */

function loopSvg(){
  const C=260,R=170,pos=i=>{const a=(-90+i*72)*Math.PI/180;return [C+R*Math.cos(a),C+R*Math.sin(a),a];};
  let s=`<defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>`;
  for(let i=0;i<4;i++){const a1=(-90+i*72+15)*Math.PI/180,a2=(-90+(i+1)*72-15)*Math.PI/180;s+=`<path class="ring" d="M${C+R*Math.cos(a1)} ${C+R*Math.sin(a1)}A${R} ${R} 0 0 1 ${C+R*Math.cos(a2)} ${C+R*Math.sin(a2)}" marker-end="url(#ah)"/>`;}
  const [x5,y5]=pos(4),[x3,y3]=pos(2);
  s+=`<path class="back" d="M${x5+30} ${y5+8}Q${C-10} ${C+20} ${x3-22} ${y3-26}" marker-end="url(#ah)"/>`;
  STEPS.forEach((st,i)=>{const [x,y,a]=pos(i),lx=x+Math.cos(a)*50,ly=y+Math.sin(a)*52,anc=Math.abs(Math.cos(a))<.3?'middle':(Math.cos(a)>0?'start':'end');
    s+=`<g class="node" data-i="${i}" tabindex="0" role="button" aria-label="${i+1}단계 ${st[0]}"><circle cx="${x}" cy="${y}" r="30"/><text class="n" x="${x}" y="${y+8}" text-anchor="middle">${i+1}</text><text x="${lx}" y="${ly+6}" text-anchor="${anc}">${st[0]}</text></g>`;});
  return `<svg viewBox="-70 20 660 480" role="group" aria-label="일하는 방식 5단계">${s}</svg>`;
}
function worldSvg(){

  let s=`<path class="land" d="${W.d}"/>`;
  Object.keys(lab).forEach((k,i)=>{const [x,y]=P[k],mx=(x+hx)/2,my=Math.min(y,hy)-Math.hypot(x-hx,y-hy)*.28;s+=`<path class="arc" style="--i:${i}" d="M${hx} ${hy}Q${mx} ${my} ${x} ${y}"/>`;});
  Object.entries(lab).forEach(([k,[t,dx,dy,a]])=>{const [x,y]=P[k];s+=`<circle class="d" cx="${x}" cy="${y}" r="9"/><text x="${x+dx}" y="${y+dy}" text-anchor="${a}">${t}</text>`;});
  s+=`<circle class="h" cx="${hx}" cy="${hy}" r="9"/><text x="${hx+16}" y="${hy-12}">서울</text>`;
  return `<svg viewBox="110 70 890 440" role="img" aria-label="해외 무대: 스위스, 중국, 베트남, 대만, 싱가포르, 일본">${s}</svg>`;

$('#main').innerHTML=HTML+HTML2+HTML3;

/* ── 스크롤 엔진 ── */
const SC=$$('.sc');
SC.forEach(s=>{ s._n=+s.dataset.steps; s._st=-1; s._stk=$('.stk',s); for(let k=0;k<s._n;k++){ const a=document.createElement('i'); a.className='snap'; a.style.top=`calc(${k} * var(--sh))`; s.appendChild(a); } s._el=$$('[data-s],[data-o],[data-r]',s); s._cnt=$$('.cnt',s); });
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
function setStep(s,k){
  if(s._st===k) return; const prev=s._st; s._st=k; s.dataset.step=k;
  s._cnt.forEach(c=>{ const at=+c.dataset.at, [a,b]=c.dataset.cnt.split(',').map(Number); cancelAnimationFrame(c._raf); c.parentNode.classList.remove('hit');
    if(k<at){ c.textContent=a.toLocaleString('ko-KR'); return; }
    if(prev>=at||reduce){ c.textContent=b.toLocaleString('ko-KR'); c.parentNode.classList.add('hit'); return; }
    const t0=performance.now(), D=1400; (function f(t){ const q=Math.min(1,(t-t0)/D), e=1-Math.pow(1-q,4); c.textContent=Math.round(a+(b-a)*e).toLocaleString('ko-KR'); if(q<1) c._raf=requestAnimationFrame(f); else c.parentNode.classList.add('hit'); })(t0); });
  s._el.forEach(e=>{ const a=e.dataset.s, o=e.dataset.o, r=e.dataset.r;
    if(r!==undefined){ const [x,y]=r.split(',').map(Number); e.classList.toggle('on',k>=x&&k<=y); }
    if(a!==undefined) e.classList.toggle('on',k>=+a);
    if(o!==undefined) e.classList.toggle('on',k===+o); });
  if(s.classList.contains('touch')) $$('.path li',s).forEach((e,j)=>{ e.classList.toggle('cur',j===k); e.classList.toggle('past',j<k||k>=5); });
  if(s.classList.contains('ind')) flyStep(s,k,6);
  if(s.classList.contains('fit')){ $$('.fc',s).forEach((e,i)=>{ e.classList.toggle('show',i<=k); e.classList.toggle('cur',i===k); e.classList.toggle('past',i<k); }); s.classList.toggle('done',k>=5); s.classList.toggle('fill',k>=6); const n=$('.fi-n b',s); if(n) n.textContent=Math.min(k+1,5); }
  $$('video[data-auto]',s).forEach(v=>{ const vis=v.closest('.only')?v.closest('.only').classList.contains('on'):true; vis?play(v):v.pause(); });
}
function play(v){ if(reduce) return; if(v.preload==='none') v.preload='auto'; const p=v.play(); if(p&&p.catch) p.catch(()=>{}); }
let ticking=false;
let lastY=0; const TOP=$('.top'); const COARSE=matchMedia('(pointer:coarse)').matches;
function tick(){
  ticking=false; const vh=innerHeight, y=scrollY;
  if(COARSE) document.documentElement.classList.toggle('snapon',!galOpen&&y<$('#proof').offsetTop-2);
  if(y<80) TOP.classList.remove('hide'); else if(y>lastY+3) TOP.classList.add('hide'); else if(y<lastY-3) TOP.classList.remove('hide'); lastY=y;
  $('#prog').style.transform=`scaleX(${clamp(y/(document.documentElement.scrollHeight-vh))})`;
  SC.forEach(s=>{
    const r=s.getBoundingClientRect(); if(r.bottom<-vh||r.top>vh*1.5) return;
    const sh=s._stk.clientHeight||vh;                       // 규칙: 한 장면 = 화면 한 칸
    const p=s._n>1?clamp(-r.top/(r.height-sh)):clamp(-r.top/sh); s.style.setProperty('--p',p.toFixed(4));
    setStep(s,Math.min(s._n-1,Math.max(0,Math.round(-r.top/sh))));
  });
}
addEventListener('scroll',()=>{ if(!ticking){ ticking=true; requestAnimationFrame(tick); } },{passive:true});
addEventListener('resize',tick); tick();

/* 일반 섹션: 화면에 들어오면 한 번 재생 */
function countUp(el){
  const to=+el.dataset.count, suf=el.dataset.suf||''; if(reduce) return;
  const t0=performance.now(), D=1300;
  (function f(t){const p=Math.min(1,(t-t0)/D), e=1-Math.pow(1-p,3); el.innerHTML=Math.round(to*e).toLocaleString('ko-KR')+suf; if(p<1) requestAnimationFrame(f);})(t0);
}
function count20(el){ if(reduce){ el.classList.add('done'); return; }
  for(let i=0;i<20;i++) setTimeout(()=>{ el.innerHTML=(i+1)+'<small>/20</small>'; if(i===19) el.classList.add('done'); },350+130*i+160);
  el.innerHTML='0<small>/20</small>'; }
const io=new IntersectionObserver(es=>es.forEach(en=>{ if(!en.isIntersecting) return; const t=en.target; io.unobserve(t);
  t.classList.add('in'); $$('[data-count]',t).forEach(countUp); const c=$('.c20',t); if(c) count20(c); }),{threshold:.35});
$$('.arch .bc,.stage,.me,.end,.ph').forEach(e=>io.observe(e));
// 숫자 기록: 700편 → 20/20 → 280만 순서로 (모바일은 각자 보일 때)
const PV=$$('.pv'), pvOn=t=>{ if(t.classList.contains('in')) return; t.classList.add('in'); $$('[data-count]',t).forEach(countUp); const c=$('.c20',t); if(c) count20(c); };
const pio=new IntersectionObserver(es=>es.forEach(en=>{ if(!en.isIntersecting) return; pio.unobserve(en.target);
  if(en.target.classList.contains('pw')){ pvOn(PV[0]); setTimeout(()=>pvOn(PV[1]),reduce?0:2000); setTimeout(()=>pvOn(PV[2]),reduce?0:2000+3500); }
  else pvOn(en.target); }),{threshold:.35});
if(innerWidth>860) pio.observe($('.pw')); else PV.forEach(e=>pio.observe(e));
const vio=new IntersectionObserver(es=>es.forEach(en=>{ const v=en.target; if(en.isIntersecting&&!v.closest('.only:not(.on)')) play(v); else v.pause(); }),{threshold:.2});
$$('video[data-auto]').forEach(v=>vio.observe(v));
// 정지 화면 영상: 지정한 초에서 멈춘 한 장면으로
$$('video[data-still]').forEach(v=>{ const t=+v.dataset.still; const go=()=>{ try{ if(Math.abs(v.currentTime-t)>.05) v.currentTime=t; }catch(e){} v.pause(); }; v.addEventListener('loadedmetadata',go); v.addEventListener('play',()=>v.pause()); if(v.readyState>=1) go(); });

/* 열기 */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-gal]'); if(g){ openGal(g.dataset.gal); return; }
  if(e.target.closest('[data-hist]')) openHist();
});
addEventListener('keydown',e=>{
  if(lb.classList.contains('open')){ if(e.key==='Escape') closeLb(); return; }
  if(galOpen){ if(e.key==='Escape') closeGal(); else if(['ArrowDown','ArrowRight','PageDown'].includes(e.key)){ e.preventDefault(); gGo(gI+1); } else if(['ArrowUp','ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); gGo(gI-1); } }
});
addEventListener('wheel',e=>{ if(!galOpen) return;
  const pg=e.target.closest('.gal-pg'); if(pg&&pg.scrollHeight>pg.clientHeight+2){ const atEnd=e.deltaY>0?pg.scrollTop+pg.clientHeight>=pg.scrollHeight-2:pg.scrollTop<=0; if(!atEnd) return; }
  e.preventDefault(); const now=Date.now(); if(Math.abs(e.deltaY)<8||now-gLock<900) return; gLock=now; gGo(gI+(e.deltaY>0?1:-1)); },{passive:false});
$('#lb button').addEventListener('click',closeLb);

/* ── 업종 카드: 하나씩 크게 등장했다가 자기 자리로 ── */
function flyXf(s){
  const st=$('.stk',s), g=$('.cards',s), sr=st.getBoundingClientRect(), gr=g.getBoundingClientRect(), hd=$('.sh',s).getBoundingClientRect();
  const cs=getComputedStyle(st), pl=parseFloat(cs.paddingLeft), pr=parseFloat(cs.paddingRight), pb=parseFloat(cs.paddingBottom);
  const ax=sr.left+pl, aw=sr.width-pl-pr, ay=hd.bottom+12, ah=sr.bottom-pb-ay, mob=innerWidth<700;
  $$('.card',s).forEach(c=>{
    const w=c.offsetWidth, h=c.offsetHeight, sc=Math.min(aw*(mob?.9:.4)/w, ah*.9/h, mob?1.6:2.4);
    const x0=gr.left+c.offsetLeft, y0=gr.top+c.offsetTop;
    const dx=ax+(aw-w*sc)/2-x0, dy=ay+(ah-h*sc)/2-y0;
    c.style.setProperty('--fx',`translate(${dx}px,${dy}px) scale(${sc})`);
    c.style.setProperty('--fx0',`translate(${dx}px,${dy+90}px) scale(${sc*.9})`);
  });
}
function flyStep(s,k,n){
  if(!s._xf){ s._xf=1; addEventListener('resize',()=>{ if(s._st>=0) flyXf(s); }); }
  flyXf(s);
  $$('.card',s).forEach((c,i)=>{ c.classList.toggle('placed',i<k); c.classList.toggle('feat',i===k&&k<n); c.classList.toggle('wait',i>k); });
  s.classList.toggle('all',k>=n);
}
/* ── 접점 장면: 다섯 접점을 자동으로 차례대로 ── */
let tcT=null;
function touchCycle(s,k){
  clearInterval(tcT); const tc=$$('.tc',s), li=$$('.path li',s);
  const show=i=>{ tc.forEach((e,j)=>e.classList.toggle('on',j===i)); li.forEach((e,j)=>{ e.classList.toggle('on',j<=i); e.classList.toggle('cur',j===i); }); };
  if(k>=1){ tc.forEach(e=>e.classList.remove('on')); li.forEach(e=>{ e.classList.add('on'); e.classList.remove('cur'); }); return; }
  let i=0; show(0); if(reduce) return;
  tcT=setInterval(()=>{ i++; if(i>=tc.length){ clearInterval(tcT); return; } show(i); },window._autoOn?850:1700);
}

/* ── 자동 재생용 정지 지점 (스크롤은 브라우저 기본 동작 그대로) ── */
const stepTop=(s,k)=>Math.round(s.offsetTop+k*(s._stk.clientHeight||innerHeight));
let AT=[];
function buildTargets(){
  const vh=innerHeight, max=document.documentElement.scrollHeight-vh; AT=[];
  SC.forEach(s=>{ for(let k=0;k<s._n;k++) AT.push({y:stepTop(s,k),s,k}); });
  $$('#main>section:not(.sc)').forEach(sec=>{
    const top=sec.offsetTop, end=Math.min(max,top+sec.offsetHeight-vh);
    AT.push({y:Math.min(top,max),sec}); for(let y=top+Math.round(vh*.75); y<end-120; y+=Math.round(vh*.75)) AT.push({y,sec});
    if(end>top+120) AT.push({y:end,sec});
  });
  AT=AT.filter((t,i,a)=>i===0||t.y-a[i-1].y>60);
}
const goY=y=>scrollTo({top:y,behavior:reduce?'auto':'smooth'});
document.addEventListener('click',e=>{ const a=e.target.closest('a[href^="#"]'); if(!a) return; const t=$(a.getAttribute('href')); if(!t) return; e.preventDefault(); stopAuto(); goY(t.offsetTop); });
buildTargets(); addEventListener('resize',buildTargets); addEventListener('load',buildTargets);

/* ── 스크롤 규칙 ──
   공통: 장면 한 단계 = 화면 한 칸.
   터치(모바일): 브라우저 기본 스냅으로 한 번 밀면 한 칸 (장면 구간에서만).
   마우스·트랙패드(데스크톱): 장면 구간에서는 한 번의 동작에 한 칸, 그 뒤 섹션은 일반 스크롤. */
const ST=()=>AT.filter(t=>t.s).map(t=>t.y);
let pBusy=false, pT=0, lastIn=0, lastMag=0, lastDir=0, lastStep=0;
function goStep(y){ pBusy=true; goY(y); clearTimeout(pT); pT=setTimeout(()=>{ pBusy=false; },reduce?120:650); lastStep=performance.now(); }
function stepDir(dir){ const T=ST(), y=scrollY; const n=dir>0?T.find(t=>t>y+4):[...T].reverse().find(t=>t<y-4); if(n===undefined) return false; goStep(n); return true; }
const inScenes=dir=>{ const T=ST(), L=T[T.length-1], y=scrollY; return dir>0? y<L-4 : y<=L+4; };
if(!COARSE){
  addEventListener('wheel',e=>{
    if(galOpen||lb.classList.contains('open')||e.ctrlKey) return;
    const dir=Math.sign(e.deltaY); if(!dir) return;
    // 새 동작 판별: 잠깐 멈췄다 다시 밀었거나, 관성(점점 약해지는 값) 중에 다시 세게 밀었을 때
    const now=performance.now(), mag=Math.abs(e.deltaY);
    const fresh=(now-lastIn>160 || dir!==lastDir || (mag>12 && mag>lastMag*1.5)) && now-lastStep>380;
    lastIn=now; lastMag=mag; lastDir=dir;
    if(!inScenes(dir)&&!pBusy) return;
    e.preventDefault();
    if(fresh&&!pBusy) stepDir(dir);
  },{passive:false});
  addEventListener('keydown',e=>{
    if(galOpen||lb.classList.contains('open')) return; if(e.key===' '&&e.target.closest&&e.target.closest('button,a,input,textarea')) return;
    const d=['ArrowDown','PageDown',' '].includes(e.key)?1:['ArrowUp','PageUp'].includes(e.key)?-1:0;
    if(!d||!inScenes(d)) return; e.preventDefault(); if(!pBusy) stepDir(d);
  });
}
// 사용자가 직접 움직이면 자동 재생 멈춤 (버튼 자체는 제외)
const userMove=e=>{ if(autoOn&&!(e.target&&e.target.closest&&e.target.closest('#auto'))) stopAuto(); };
addEventListener('wheel',userMove,{passive:true});
addEventListener('touchstart',userMove,{passive:true});
addEventListener('keydown',e=>{ if(['ArrowDown','ArrowUp','PageDown','PageUp',' ','Home','End'].includes(e.key)) userMove(e); });

/* ── 자동 재생 ── */
const AB=$('#auto'); let autoOn=false, aT=0, aI=0, aStart=0, aDur=0, aRaf=0;
const DWELL={hook:[2600,2600,2600,2200,1800,2600,3000],hello:[3400,3600,4200],ind:[2600,2600,2600,2600,2600,2600,4800],sys:[3800,3800],team:[3400,3600],touch:[3000,2600,2600,2600,2600,3400],fit:[3200,3200,3600,3000,3400,2600,2400,1600]};
const SPEED=.5;   // 자동 재생 속도 (1 = 기존, .5 = 2배 빠르게)
const dwell=t=>Math.round((t.s?(DWELL[t.s.className.split(' ')[1]]||[])[t.k]||3200:(t.sec.id==='work'?3200:3800))*SPEED);
function ring(){ if(!autoOn) return; AB.style.setProperty('--ap',Math.min(1,(performance.now()-aStart)/aDur)); aRaf=requestAnimationFrame(ring); }
function autoStep(){
  if(!autoOn) return;
  if(aI>=AT.length){ stopAuto(); return; }
  const t=AT[aI]; goY(t.y); aDur=dwell(t)+(aI?450:0); aStart=performance.now(); cancelAnimationFrame(aRaf); ring();
  aT=setTimeout(()=>{ aI++; autoStep(); },aDur);
}
function startAuto(){
  buildTargets(); autoOn=true; window._autoOn=true; AB.classList.add('on'); AB.querySelector('.al').textContent='멈춤';
  const y=scrollY; aI=AT.findIndex(t=>t.y>=y-4); if(aI<0||aI>=AT.length-1) aI=0;
  if(Math.abs(AT[aI].y-y)<6){ aStart=performance.now(); aDur=dwell(AT[aI]); ring(); aT=setTimeout(()=>{ aI++; autoStep(); },aDur); } else autoStep();
}
function stopAuto(){ autoOn=false; window._autoOn=false; clearTimeout(aT); cancelAnimationFrame(aRaf); AB.classList.remove('on'); AB.querySelector('.al').textContent='자동 재생'; AB.style.setProperty('--ap',0); }
AB.addEventListener('click',e=>{ e.stopPropagation(); if(autoOn) stopAuto(); else startAuto(); });

/* 맨 위로 */
const TT=$('#totop');
TT.addEventListener('click',()=>{ stopAuto(); scrollTo({top:0,behavior:reduce?'auto':'smooth'}); });
addEventListener('scroll',()=>TT.classList.toggle('show',scrollY>innerHeight*.8),{passive:true});

})();
