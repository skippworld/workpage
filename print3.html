#lb{position:fixed;inset:0;z-index:90;background:rgba(8,7,6,.96);display:none;overflow:auto}

.gp{padding:52px 64px;display:flex;flex-direction:column;gap:22px}
.gp .ghd{display:flex;align-items:baseline;gap:18px;border-bottom:2px solid #2c2825;padding-bottom:14px;flex:none}
.gp .ghd span{color:var(--amber);font-weight:800;font-size:20px}
.gp .ghd h3{font-size:42px;font-weight:800;letter-spacing:-.045em;line-height:1.1}

.gp .gbody>*{flex:none}
.gp .pi{display:block;position:relative;text-decoration:none;color:#fff}
.gp .pf{position:relative;display:block;width:100%;aspect-ratio:var(--r);background:#211e1b;border-radius:4px;overflow:hidden}
.gp .pf img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

.gp .pi .pl{right:8px;bottom:auto;top:8px}
.gp .pcols{display:flex;flex-wrap:wrap;justify-content:center;gap:14px}
.gp .pcols>.pi{width:calc((100% - (var(--n) - 1)*14px)/var(--n))}
.gp .pjrow{display:flex;gap:14px}
.gp .pjrow>.pi{flex:var(--rn) 1 0;min-width:0}

#gal{position:fixed;top:var(--top);bottom:var(--bot);left:var(--side);right:var(--side);z-index:60;background:#0f0d0c;color:#ece5da;display:none;flex-direction:column;box-shadow:0 30px 80px -30px #000;--gs:.5;--gx:0px;--gy:0px}

.gp .pf video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gp button.pi{width:100%;text-align:left;cursor:zoom-in}
.gp .plinks a:hover{border-color:var(--amber);color:var(--amber)}
.gp .hist{overflow:visible;padding:0;grid-template-columns:repeat(4,1fr);gap:48px;flex:none}
.gp .gbody:has(.hist.htop){justify-content:flex-start;padding-top:20px}
.gp .hist.htop h4{font-size:28px;padding-bottom:12px;margin-bottom:10px}
.gp .hist.htop li{font-size:20px;padding:14px 0;grid-template-columns:3.4em 1fr;line-height:1.4}

/* 유튜브 썸네일 그리드: 한 장의 이미지처럼 */
.ytg{position:absolute;inset:0;z-index:1;display:grid;grid-template-columns:repeat(var(--c),1fr);gap:2px;background:#141210}
.ytg>span{position:relative;overflow:hidden}
.ytg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ytg.ytfit{display:flex;flex-wrap:wrap;align-content:center;gap:6px;padding:0 40px}
.ytg.ytfit>span{flex:0 0 calc(50% - 3px);height:auto;aspect-ratio:16/9}
.ytg.ytfit{background:none}

/* 16:9 로고 이미지를 자르지 않고 어두운 바탕에 */
.m.mfit{background:linear-gradient(#171717,#070707)}
.m.mfit img{object-fit:contain}
.m.mfit .src{display:none}

/* 블랙비스트 룩북 아트워크 3장 */
.gp .plb3{display:flex;justify-content:center;gap:14px;height:min(860px,72vh)}
.gp .plb3 .pi,.gp .plb3 .pf{height:100%}
.gp .plb3 .pf{aspect-ratio:2/3;width:auto}
@media (max-width:860px){.gp .plb3{flex-direction:column;height:auto;align-items:center}.gp .plb3 .pi{height:auto;width:100%}.gp .plb3 .pf{width:100%;height:auto}}

.s20{position:relative}
.s20>i{z-index:1}
.s20bg{position:absolute;inset:0;display:grid;grid-template-rows:1fr 1fr;gap:6px;z-index:0}
.s20bg .m{height:100%;background:#d9d4ce}

.s20bg{grid-template-rows:1fr;gap:0}

@page{size:1920px 1080px;margin:0}
:root{--o:#ff6a13;--o2:#ff9a52;--ink:#141210;--mute:#6b645c;--line:#e3ded7;--wash:#f6f3ef;--amber:#f06a1c;--ac:#f06a1c;--ko:"Paperlogy","Pretendard",-apple-system,"Apple SD Gothic Neo",sans-serif;--num:var(--ko)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
html,body{background:#fff;color:var(--ink);font-family:var(--ko);-webkit-font-smoothing:antialiased;word-break:keep-all;line-height:1.5}
a{color:inherit;text-decoration:none}
img{display:block}
#print{width:1920px}
.pp{position:relative;width:1920px;height:1080px;overflow:hidden;contain:strict;break-after:page;page-break-after:always;background:#fff;padding:96px 110px 110px}
.pp:last-child{break-after:auto;page-break-after:auto}
.pp.o{background:var(--o)}
.pp.o .k{color:var(--ink)}
h2{font-weight:800;letter-spacing:-.04em;line-height:1.08}
.k{font-size:22px;font-weight:800;color:var(--o)}
.pfoot{position:absolute;left:110px;right:110px;bottom:44px;display:flex;justify-content:space-between;font-size:16px;font-weight:600;color:var(--mute)}
.pp.o .pfoot{color:rgba(20,18,16,.6)}
.m{position:relative;overflow:hidden;background:#efebe6;width:100%;height:100%}
.m img{width:100%;height:100%;object-fit:cover}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{font-size:17px;font-weight:700;border:1.5px solid var(--line);border-radius:999px;padding:5px 14px;background:#fff;color:var(--ink)}
.pl{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;background:rgba(12,11,10,.8);display:flex;align-items:center;justify-content:center;z-index:3}
.pl svg{width:11px;fill:#fff;margin-left:2px}
.yta{position:relative;display:block}

/* 1 cover */
.cover{display:grid;grid-template-rows:auto 1fr auto;padding-top:110px}
.cv-big{font-size:168px;font-weight:800;letter-spacing:-.055em;line-height:1;margin-top:40px}
.cv-big i{font-style:normal;color:#fff;margin:0 .1em}
.cv-end{position:absolute;right:110px;bottom:150px;text-align:right}
.cv-end p{font-size:92px;font-weight:800;letter-spacing:-.05em;line-height:1.05;color:#fff}
.cv-end span{display:block;font-size:30px;font-weight:800;margin-top:22px}
.cv-src{position:absolute;left:110px;bottom:96px;font-size:18px;font-weight:600;color:rgba(20,18,16,.65)}

/* 2 hello */
.hello{display:grid;grid-template-columns:640px 1fr;gap:96px;padding:0 110px 0 0}
.h-photo{height:1080px}
.h-t{padding:96px 0 110px;display:flex;flex-direction:column}
.h-t h2{font-size:72px;margin-top:10px}
.lead{font-size:26px;color:var(--mute);margin-top:22px}
.h-rows{display:flex;flex-direction:column;gap:18px;margin-top:30px}
.h-rows>div{display:grid;grid-template-columns:260px 1fr;gap:28px;align-items:center;border-top:2px solid var(--ink);padding-top:22px}
.h-rows figure{height:150px}
.h-rows b{display:block;font-size:27px;font-weight:800;letter-spacing:-.03em;line-height:1.3}
.h-rows div>span:not(.chips){display:block;font-size:19px;color:var(--mute);margin-top:10px}
.h-rows .chips{margin-top:14px}
.h-rows .chips span{font-size:14px;padding:3px 11px}
.h-rows .chips{gap:6px;margin-top:10px}
.h-end{margin-top:auto;padding-top:24px;font-size:28px;font-weight:800;letter-spacing:-.02em}

/* shared header */

/* 3 industries */
.ind{display:flex;flex-direction:column;gap:44px}

.card{display:flex;flex-direction:column;gap:6px}
.card>.m{height:230px}
.ck{font-size:16px;font-weight:800;color:var(--o);margin-top:10px}

.formula{list-style:none;display:grid;grid-template-columns:repeat(6,1fr);margin-top:auto}

.formula li:not(:last-child)::after{content:"→";position:absolute;right:10px;top:26px;font-size:26px;font-weight:800;color:var(--o)}
.formula i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;font-size:19px;font-weight:800}
.formula b{display:block;font-size:30px;font-weight:800;letter-spacing:-.03em;margin-top:14px}

.formula .back{border-top-color:var(--o)}

.formula .back b{color:var(--o)}

/* 4 system */
.sys{display:grid;grid-template-columns:560px 600px 1fr;gap:56px;align-items:center}
.sy-t h2{font-size:64px;margin-top:14px}
.sy-t p:not(.k){font-size:20px;line-height:1.65;margin-top:26px}
.sy-t .sum b{display:block;font-size:38px;font-weight:800;letter-spacing:-.03em;color:#fff;margin-bottom:4px}
.sy-t p.sum{font-size:22px;font-weight:700;margin-top:28px}
.spec{position:relative;background:#fff;padding:40px 40px 48px;box-shadow:0 40px 80px -40px rgba(20,18,16,.5);transform:rotate(-1.5deg)}
.spec h5{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:28px;font-weight:800;border-bottom:3px solid var(--ink);padding-bottom:14px}
.spec h5 small{display:block;font-size:15px;font-weight:600;color:var(--mute);margin-top:4px}

.spec ol{list-style:none;counter-reset:r}
.spec li{counter-increment:r;display:flex;gap:16px;align-items:baseline;padding:15px 0;border-bottom:1px solid var(--line);font-size:23px}
.spec li::before{content:counter(r);font-size:18px;font-weight:800;color:var(--o);width:1.2em}

.stamp{position:absolute;right:30px;bottom:-22px;font-size:18px;font-weight:800;color:var(--o);border:2.5px solid var(--o);border-radius:999px;padding:7px 18px;background:#fff;transform:rotate(-6deg)}
.mans{display:flex;flex-direction:column;gap:18px}
.man{background:#fff;border-top:6px solid var(--ink);padding:20px 24px 16px;box-shadow:0 26px 50px -30px rgba(20,18,16,.5)}

.mt{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em}
.mt small{display:block;font-size:14px;font-weight:800;color:var(--o)}
.man ul{list-style:none;margin-top:10px;display:flex;flex-direction:column;gap:5px}
.man li{font-size:16.5px;padding-left:14px;position:relative;line-height:1.45}
.man li::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:6px;background:var(--o)}
.mp{display:flex;justify-content:space-between;font-size:13.5px;color:var(--mute);border-top:1px solid var(--line);padding-top:8px;margin-top:12px}
.mp em{font-style:normal;font-weight:800;color:var(--ink)}

/* 5 team */
.team{background:var(--wash);display:grid;grid-template-columns:1fr 1fr;gap:96px;align-items:center}
.tm-t h2{font-size:104px;margin-top:22px}
.tm-t>p:last-child{font-size:23px;color:var(--mute);margin-top:30px;line-height:1.6}

.org{display:flex;flex-direction:column;align-items:center}
.bx{background:#fff;border:1.5px solid var(--line);padding:20px 30px;text-align:center;font-weight:800;font-size:28px;min-width:420px}

.bx.doc{border:2.5px dashed var(--o)}

.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:700px}
.two .bx{min-width:0}
.bx.res{display:grid;grid-template-columns:1fr 1fr;padding:0;background:var(--o);border-color:var(--o);width:700px}
.bx.res>div{padding:20px 10px}

.bx.res b{font-size:52px;letter-spacing:-.03em}
.bx.res small{color:var(--ink)}

/* 6 touch */
.touch{display:flex;flex-direction:column;gap:34px;padding-bottom:0}

.tps{list-style:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:24px;flex:1;min-height:0;align-items:start}

.trow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:6px}

.trow em{position:absolute;left:8px;bottom:8px;font-style:normal;font-size:14px;font-weight:800;background:var(--o);color:#1d0e03;padding:2px 8px}

.band{margin:0 -110px;background:var(--o);padding:30px 110px 70px;display:flex;align-items:center;gap:60px}

.touch .pfoot{color:rgba(20,18,16,.6);bottom:26px}

/* 7 days */
.days{display:grid;grid-template-columns:600px 1fr;gap:96px;align-items:center}

.dys li{border-top:4px solid var(--ink);padding-top:26px}
.dys li:first-child{border-top-color:var(--o)}
.dn{display:block;font-size:104px;font-weight:800;letter-spacing:-.05em;line-height:1}
.dys b{display:block;font-size:34px;font-weight:800;color:var(--o);margin-top:16px}
.dys p{font-size:21px;color:var(--mute);margin-top:12px;line-height:1.6}

/* 8 proof */
.proof{display:flex;flex-direction:column;gap:56px}

/* 21 stage */
.stage{display:grid;grid-template-columns:820px 1fr;gap:96px;padding:0 110px 0 0}

function loopSvg(){
  const C=260,R=170,pos=i=>{const a=(-90+i*72)*Math.PI/180;return [C+R*Math.cos(a),C+R*Math.sin(a),a];};
  let s=`<defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>`;
  for(let i=0;i<4;i++){const a1=(-90+i*72+15)*Math.PI/180,a2=(-90+(i+1)*72-15)*Math.PI/180;s+=`<path class="ring" d="M${C+R*Math.cos(a1)} ${C+R*Math.sin(a1)}A${R} ${R} 0 0 1 ${C+R*Math.cos(a2)} ${C+R*Math.sin(a2)}" marker-end="url(#ah)"/>`;}
  const [x5,y5]=pos(4),[x3,y3]=pos(2);
  s+=`<path class="back" d="M${x5+30} ${y5+8}Q${C-10} ${C+20} ${x3-22} ${y3-26}" marker-end="url(#ah)"/>`;
  STEPS.forEach((st,i)=>{const [x,y,a]=pos(i),lx=x+Math.cos(a)*50,ly=y+Math.sin(a)*52,anc=Math.abs(Math.cos(a))<.3?'middle':(Math.cos(a)>0?'start':'end');
    s+=`<g class="node" data-i="${i}" tabindex="0" role="button" aria-label="${i+1}단계 ${st[0]}"><circle cx="${x}" cy="${y}" r="30"/><text class="n" x="${x}" y="${y+8}" text-anchor="middle">${i+1}</text><text x="${lx}" y="${ly+6}" text-anchor="${anc}">${st[0]}</text></g>`;});
  return `<svg viewBox="-70 20 660 480" role="group" aria-label="일하는 방식 5단계">${s}</svg>`;
}
function worldSvg(){
  const W=MAPS.world,P=W.pts,[hx,hy]=P.kr;
  const lab={ch:['스위스',18,10,'start'],cn:['중국',-16,-18,'end'],vn:['베트남',-18,8,'end'],tw:['대만',18,26,'start'],sg:['싱가포르',-18,8,'end'],jp:['일본',0,38,'middle']};
  let s=`<path class="land" d="${W.d}"/>`;
  Object.keys(lab).forEach((k,i)=>{const [x,y]=P[k],mx=(x+hx)/2,my=Math.min(y,hy)-Math.hypot(x-hx,y-hy)*.28;s+=`<path class="arc" style="--i:${i}" d="M${hx} ${hy}Q${mx} ${my} ${x} ${y}"/>`;});
  Object.entries(lab).forEach(([k,[t,dx,dy,a]])=>{const [x,y]=P[k];s+=`<circle class="d" cx="${x}" cy="${y}" r="9"/><text x="${x+dx}" y="${y+dy}" text-anchor="${a}">${t}</text>`;});
  s+=`<circle class="h" cx="${hx}" cy="${hy}" r="9"/><text x="${hx+16}" y="${hy-12}">서울</text>`;
  return `<svg viewBox="110 70 890 440" role="img" aria-label="해외 무대: 스위스, 중국, 베트남, 대만, 싱가포르, 일본">${s}</svg>`;
}
